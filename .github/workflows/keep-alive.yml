# Mantém a API acordada no Render gratuito (ela dorme após ~15 min sem acesso
# e a primeira requisição depois disso demora ou falha).
# Uma só API ligada o mês todo usa ~744 h das 750 h grátis do Render.
name: Manter API acordada

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acessar /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://climaagro-api-jpm.onrender.com/api/health || true)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
